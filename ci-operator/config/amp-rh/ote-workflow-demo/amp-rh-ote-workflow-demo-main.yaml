build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-release-golang-1.22-openshift-4.18
images:
  items:
  - dockerfile_literal: |
      FROM src
      RUN make build
    from: src
    to: interop-tests
resources:
  '*':
    requests:
      cpu: 200m
      memory: 400Mi
tests:
- as: lint
  commands: make lint
  container:
    from: src
- as: unit
  commands: make test
  container:
    from: src
- as: e2e
  steps:
    cluster_profile: aws
    test:
    - as: run-tests
      cli: latest
      commands: |
        export EXTENSION_ARTIFACTS_DIR="${ARTIFACT_DIR}"
        make ote-test
      from: interop-tests
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: amp-rh
  repo: ote-workflow-demo
